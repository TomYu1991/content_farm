# Work draft workflow: draft the TEXT of one portfolio work from the maker's notes.
#
# Before running it, the maker pushes branch work/<slug> containing (created by
# `npm run ingest`, then edited by hand):
#   src/assets/works/<slug>/*.jpg        photos (EXIF/GPS already stripped)
#   src/assets/works/<slug>/notes.md     making notes (the model's only source)
#   src/content/works/<slug>.md          front-matter with draft: true
#
# - Trigger: workflow_dispatch only; must run from the Default_Branch so the
#   reviewed tooling is used. work/<slug> is only read as data.
# - Two jobs so the model credential and the repository write token never
#   share a job (same model as generate-draft.yml):
#     generate     contents: read, persist-credentials: false; the single
#                  gateway secret is injected into ONE step only.
#     work-branch  contents: write; no model secret; re-verifies the bundle
#                  against the CURRENT work/<slug> files and commits exactly
#                  one file, src/content/works/<slug>.md, to work/<slug>.
# - Photos never pass through the bundle or this workflow's commits.
# - No pull-requests permission is granted. The run prints a compare URL; an
#   editor reviews the six items, flips draft: true -> false by hand and merges.
#   This workflow never approves, merges or publishes.
#
# Configuration: same secret/variables as generate-draft.yml.

name: Generate work draft (manual)

on:
  workflow_dispatch:
    inputs:
      work_slug:
        description: "作品 slug（分支 work/<slug> 已包含照片、notes.md 与作品文件）"
        required: true
        type: string
      prompt_name:
        description: "Prompt 名称"
        required: true
        type: string
        default: work-draft
      prompt_version:
        description: "Prompt 版本（MAJOR.MINOR.PATCH）"
        required: true
        type: string
        default: 1.0.0

permissions: {}

concurrency:
  group: generate-work-draft-${{ inputs.work_slug }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Inputs reach scripts only through the environment (prevents script injection).
  GEN_WORK_SLUG: ${{ inputs.work_slug }}
  GEN_PROMPT_NAME: ${{ inputs.prompt_name }}
  GEN_PROMPT_VERSION: ${{ inputs.prompt_version }}

jobs:
  generate:
    name: Generate and validate work draft (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require the Default_Branch workflow definition and a valid slug
        env:
          RUN_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RUN_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow from the default branch so reviewed generation code is used."
            exit 1
          fi
          if ! [[ "$GEN_WORK_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || [ "${#GEN_WORK_SLUG}" -gt 80 ]; then
            echo "::error::work_slug must be lowercase letters, digits and single hyphens (1-80)."
            exit 1
          fi

      - name: Check out tooling (Default_Branch, no persisted token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out work/<slug> as data (no persisted token)
        uses: actions/checkout@v4
        with:
          ref: work/${{ inputs.work_slug }}
          path: work
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .

      - name: Generate work bundle
        # The only step that can read the model gateway credential.
        env:
          MODEL_GATEWAY: ${{ vars.MODEL_GATEWAY }}
          MODEL_ID: ${{ vars.MODEL_ID }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
          MODEL_GATEWAY_API_KEY: ${{ secrets.MODEL_GATEWAY_API_KEY }}
          BUDGET_INPUT_PRICE_PER_MTOK: ${{ vars.BUDGET_INPUT_PRICE_PER_MTOK }}
          BUDGET_OUTPUT_PRICE_PER_MTOK: ${{ vars.BUDGET_OUTPUT_PRICE_PER_MTOK }}
          BUDGET_MAX_INPUT_TOKENS: ${{ vars.BUDGET_MAX_INPUT_TOKENS }}
          BUDGET_MAX_OUTPUT_TOKENS: ${{ vars.BUDGET_MAX_OUTPUT_TOKENS }}
          BUDGET_MAX_COST_PER_ARTICLE: ${{ vars.BUDGET_MAX_COST_PER_ARTICLE }}
          BUDGET_MAX_COST_PER_RUN: ${{ vars.BUDGET_MAX_COST_PER_RUN }}
        run: >-
          python -m content_pipeline.cli generate-work
          --bundle-dir "$RUNNER_TEMP/work-bundle"
          --work-repo work
          --policy docs/compliance.md
          --prompts-dir prompts

      - name: Verify work bundle
        run: >-
          python -m content_pipeline.cli verify-work-bundle
          --bundle-dir "$RUNNER_TEMP/work-bundle"
          --work-repo work
          --policy docs/compliance.md

      - name: Upload work bundle
        uses: actions/upload-artifact@v4
        with:
          name: work-bundle
          path: ${{ runner.temp }}/work-bundle
          if-no-files-found: error
          retention-days: 1

  work-branch:
    name: Commit the drafted text to work/<slug>
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out tooling (Default_Branch, no persisted token)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tool
          persist-credentials: false

      - name: Check out work/<slug> work tree
        uses: actions/checkout@v4
        with:
          ref: work/${{ inputs.work_slug }}
          path: repo

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r tool/requirements.lock
          python -m pip install --no-deps ./tool

      - name: Download work bundle
        uses: actions/download-artifact@v4
        with:
          name: work-bundle
          path: ${{ runner.temp }}/work-bundle

      - name: Verify bundle against the current work/<slug> files
        id: verify
        run: >-
          python -m content_pipeline.cli verify-work-bundle
          --bundle-dir "$RUNNER_TEMP/work-bundle"
          --work-repo repo
          --policy tool/docs/compliance.md
          --github-output "$GITHUB_OUTPUT"

      - name: Put the work tree on the work branch
        working-directory: repo
        env:
          BRANCH: ${{ steps.verify.outputs.branch }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" != "work/$GEN_WORK_SLUG" ] || [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Refusing to write: target is not work/<slug>."
            exit 1
          fi
          git switch -C "$BRANCH"

      - name: Apply work draft to the work tree
        id: apply
        env:
          BRANCH: ${{ steps.verify.outputs.branch }}
        run: >-
          python -m content_pipeline.cli apply-work-draft
          --bundle-dir "$RUNNER_TEMP/work-bundle"
          --policy tool/docs/compliance.md
          --repo repo
          --branch "$BRANCH"
          --default-branch "$DEFAULT_BRANCH"
          --server-url "$GITHUB_SERVER_URL"
          --repository "$GITHUB_REPOSITORY"
          --instructions-file "$RUNNER_TEMP/pr-instructions.md"
          --github-output "$GITHUB_OUTPUT"

      - name: Commit and push the work file only
        working-directory: repo
        env:
          BRANCH: ${{ steps.verify.outputs.branch }}
          WORK_PATH: ${{ steps.apply.outputs.path }}
        run: |
          set -euo pipefail
          if ! [[ "$BRANCH" =~ ^work/[a-z0-9]+(-[a-z0-9]+)*$ ]] || [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Refusing to push: target is not a work/<slug> branch."
            exit 1
          fi
          if [ "$WORK_PATH" != "src/content/works/$GEN_WORK_SLUG.md" ]; then
            echo "::error::Refusing to commit: unexpected work path."
            exit 1
          fi
          if [ "$(git symbolic-ref --short HEAD)" != "$BRANCH" ]; then
            echo "::error::Work tree is not on the work branch."
            exit 1
          fi
          others="$(git status --porcelain --untracked-files=all -- . ":(exclude)$WORK_PATH")"
          if [ -n "$others" ]; then
            echo "::error::Unexpected changes outside the work file; nothing was pushed."
            exit 1
          fi
          if [ -z "$(git status --porcelain --untracked-files=all -- "$WORK_PATH")" ]; then
            echo "Work text unchanged on $BRANCH; no new commit."
            exit 0
          fi
          git add -- "$WORK_PATH"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "draft: write text for $WORK_PATH (requires human review)"
          # Plain (non-force) push: fails if the maker pushed meanwhile; rerun then.
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Publish Pull Request creation instructions
        run: |
          cat "$RUNNER_TEMP/pr-instructions.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/pr-instructions.md"
